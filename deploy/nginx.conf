# Ora reverse proxy — TLS termination, proxies to the Next.js app only.
# The MCP server and Ollama are NEVER exposed; web reaches them internally.

# HTTP → HTTPS redirect
server {
  listen 80;
  server_name _;
  # Let's Encrypt http-01 challenge (if using certbot webroot)
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;   # replace with your domain, e.g. ora.app

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 12m;            # allow image/file uploads in chat

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # streaming (SSE / chunked LLM + TTS responses) — don't buffer
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_set_header Connection "";
  }
}
