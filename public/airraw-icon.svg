<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none" role="img" aria-label="AIRRAW">
  <!-- The favicon. Same mark as airraw-mark.svg with the waveform reduced to the
       bar alone: a browser tab renders this at 16px, where three 9-unit ticks are
       four grey pixels that read as dirt rather than as sound. What survives the
       shrink is a legible A, which is the only job at that size. -->
  <rect width="300" height="300" rx="66" fill="#0d0714"/>
  <path d="M 62 238 Q 100 158 150 66 L 238 238"
        stroke="#f472b6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 97 186 H 201" stroke="#f472b6" stroke-width="15" stroke-linecap="round"/>
</svg>
